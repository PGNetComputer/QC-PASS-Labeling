<style>
:root{
  --hijau:#1f6f54; --hijau-muda:#e6f3ee; --hijau-teks:#155c44;
  --oranye:#e0781f; --oranye-muda:#fdf0e3; --merah:#c0473b; --merah-muda:#fbeceb;
  --abu:#6b7280; --abu-2:#9aa1ab; --garis:#e7e9ec; --latar:#f3f5f4; --kartu:#fff; --teks:#16211d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:#d9dfdc;color:var(--teks);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{width:100%;max-width:480px;height:100%;background:var(--latar);display:flex;flex-direction:column;position:relative;overflow:hidden}

.top{padding:12px 16px 10px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--kartu);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--garis)}
.logo{width:36px;height:36px;border-radius:11px;background:var(--hijau);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.top h1{font-size:16px;font-weight:800;line-height:1.15}
.top small{font-size:12px;color:var(--abu);font-weight:600;display:flex;align-items:center;gap:5px}
.top .grow{flex:1;min-width:0}
.ikon-btn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--abu);font-size:18px;flex:none}
.ikon-btn:active{background:var(--latar)}
.putar{animation:putar 1s linear infinite;display:inline-block}
@keyframes putar{to{transform:rotate(360deg)}}

.isi{flex:1;min-height:0;overflow:auto;padding:12px 14px 96px;-webkit-overflow-scrolling:touch}
.kartu{background:var(--kartu);border-radius:16px;padding:14px}
.judul-bagian{font-size:12px;font-weight:800;color:var(--abu);text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 8px;display:flex;justify-content:space-between}

.hero{background:var(--hijau);color:#fff;border-radius:20px;padding:16px;cursor:pointer;width:100%;text-align:left;display:block}
.hero .baris{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.hero .lbl{font-size:12.5px;opacity:.8;font-weight:700}
.hero .angka{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.hero .lihat{font-size:12.5px;font-weight:800;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:9px;flex:none}
.hitung{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.hitung button{background:var(--kartu);border-radius:14px;padding:11px 10px;text-align:left;border:2px solid transparent}
.hitung button.on{border-color:var(--hijau)}
.hitung .a{font-size:21px;font-weight:800;line-height:1}
.hitung .a small{font-size:12px;font-weight:700;color:var(--abu);margin-left:1px}
.hitung .t{font-size:11.5px;color:var(--abu);font-weight:700;margin-top:4px}
.cari{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--garis);background:var(--kartu);font-size:14.5px;margin:10px 0 4px;outline:none}
.cari:focus{border-color:var(--hijau)}

.item{background:var(--kartu);border-radius:14px;padding:12px 13px;display:flex;flex-wrap:wrap;gap:0 11px;align-items:flex-start;margin-bottom:8px}
.item .bawah-item{flex:0 0 100%;padding-left:41px}
.ikon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px}
.ikon.datang{background:var(--hijau-muda);color:var(--hijau)}
.ikon.tunggu{background:var(--oranye-muda);color:var(--oranye)}
.ikon.batal{background:#eef0f2;color:var(--abu-2)}
.ikon.gagal{background:var(--merah-muda);color:var(--merah)}
.item .nm{font-weight:800;font-size:14.5px;line-height:1.25;word-break:break-word}
.item .no{font-size:11.5px;color:var(--abu);font-family:ui-monospace,Menlo,monospace;margin-top:2px;word-break:break-all}
.item .ket{font-size:12.5px;color:var(--abu);margin-top:4px;font-weight:600}
.item .ket.o{color:var(--oranye)} .item .ket.g{color:var(--hijau)} .item .ket.m{color:var(--merah)}
.item .kanan{margin-left:auto;text-align:right;flex:none;padding-left:6px}
.item .hrg{font-weight:800;font-size:14px;white-space:nowrap}
.item.batal .nm,.item.batal .hrg{color:var(--abu-2);text-decoration:line-through;text-decoration-thickness:1px}
.item.cek{border:1.5px solid #f3c79c}
.ikon.cek{background:#fde3cc;color:#b85c10}
.item .ket.c{color:#b85c10}
.tebak{margin-top:9px;background:var(--hijau-muda);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--hijau-teks);font-weight:600;line-height:1.4}
.tebak b{font-weight:800}
.tebak .br{margin-top:4px;padding-top:4px;border-top:1px dashed #b9dccd}
.tebak.tidak{background:#f4f5f6;color:var(--abu)}
.aksi-item{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.aksi-item button{font-size:12.5px;font-weight:800;padding:7px 11px;border-radius:9px;background:#f1f2f4;color:#4b5563}
.aksi-item button.batal{background:var(--merah-muda);color:var(--merah)}
.item.bisa{cursor:pointer}
.item .hapus{margin-top:8px;font-size:12px;font-weight:800;color:var(--merah);padding:5px 9px;border-radius:8px;background:var(--merah-muda)}
.lampu{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--oranye);margin-left:6px;filter:blur(.4px);vertical-align:middle;animation:kedip 1s infinite}
@keyframes kedip{50%{opacity:.3}}

.lipat{width:100%;text-align:left;background:var(--kartu);border-radius:14px;padding:12px 14px;font-weight:800;font-size:14px;color:var(--hijau);display:flex;justify-content:space-between;margin-bottom:8px}
.lipat.batal{color:var(--abu)}
.kosong{text-align:center;color:var(--abu);font-size:13.5px;padding:26px 10px;font-weight:600}

.komisi-besar{background:var(--hijau);color:#fff;border-radius:20px;padding:18px}
.komisi-besar .lbl{font-size:12.5px;font-weight:700;opacity:.8}
.komisi-besar .angka{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px}
.komisi-besar .sub{font-size:12.5px;opacity:.85;font-weight:600;line-height:1.45}
.bulan{background:var(--kartu);border-radius:14px;margin-bottom:8px;overflow:hidden}
.bulan-kepala{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;text-align:left}
.bulan-kepala .b{font-weight:800;font-size:14.5px}
.bulan-kepala .n{font-size:12px;color:var(--abu);font-weight:600}
.bulan-kepala .rp{margin-left:auto;font-weight:800;font-size:14.5px;text-align:right}
.lencana{display:inline-block;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;margin-top:3px}
.lencana.cair{background:var(--hijau-muda);color:var(--hijau-teks)}
.lencana.belum{background:var(--oranye-muda);color:#9a4d0c}
.jual{padding:9px 14px;border-top:1px solid var(--garis);display:flex;gap:10px;font-size:12.5px}
.jual .nb{font-weight:700;line-height:1.3}
.jual .cs{color:var(--abu);font-size:11.5px;margin-top:2px}
.jual .km{margin-left:auto;font-weight:800;color:var(--hijau);white-space:nowrap}
.catatan{font-size:11.5px;color:var(--abu);text-align:center;margin-top:8px;font-weight:600}

/* ===== tema hangat ala Claude (sama dengan QC PASS) ===== */
:root{

  --oranye:#b5702a; --oranye-muda:#f8ecd2; --merah:#b3261e; --merah-muda:#fde8e6;
  --abu:#6b675f; --abu-2:#9a958b; --garis:#e5e1d8; --latar:#f5f3ee; --kartu:#fffefb; --teks:#2b2a27;
  --aksen:#c96442; --aksen-2:#b5573a; --sukses:#4a6b43; --sukses-muda:#e3ecdf; --serif:Georgia,"Times New Roman",serif;
}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#ebe7df}
button,input,textarea{font-family:inherit}
#app{background:var(--latar)}

.hitung button{border:1px solid var(--garis);border-radius:12px;background:var(--kartu)}
.hitung button.on{border-color:var(--hijau);background:var(--hijau-muda)}
.hitung .a{font-family:var(--serif);font-weight:600}
.judul-bagian{color:var(--abu);letter-spacing:.05em;font-weight:700}
.cari{border-radius:10px;background:var(--kartu)}
.cari:focus,.form input:focus,.form textarea:focus,.balas input:focus{border-color:#b9ab98;box-shadow:0 0 0 3px #f0e6da;outline:0}
.form input,.form textarea{border:1px solid var(--garis);border-radius:10px;background:#fff}
.btn{background:var(--hijau);border-radius:10px;font-weight:700}

[data-kirimaju],[data-kirimdana],#simpan,[data-yakintrf]{background:var(--aksen)!important}

var API_FN=['getData','simpanPembelian','cairkan','tandaiBatal','unggahInvoice','hasilPost','pasangLampiran','lihatInvoice','buatPermintaan','prosesTransfer','simpanRekening','lihatFileTransfer','getTim','simpanTokenPush','ajukanSetuju','putuskanSetuju','simpanIncaran','lihatFileSetuju','balasSetuju','lihatBuktiCair'];
var JSONP_MAX=5000;

function jsonp(param, selesai, batasMs){
  var nama='slCb'+Date.now()+Math.floor(Math.random()*1e5);
  var tag=document.createElement('script'), sudah=false;
  function bersih(){
    sudah=true; clearTimeout(jam);
    window[nama]=function(){};
    setTimeout(function(){ try{ delete window[nama]; }catch(e){} }, 120000);
    if(tag.parentNode) tag.parentNode.removeChild(tag);
  }
  var jam=setTimeout(function(){ if(!sudah){ bersih(); selesai(new Error('Server tidak menjawab. Periksa internet, lalu coba lagi.')); } }, batasMs||60000);
  window[nama]=function(isi){
    if(sudah) return; bersih();
    if(isi && isi.galat){ var er=new Error(isi.galat); er.kodeSalah=!!isi.kodeSalah; selesai(er); }
    else selesai(null, isi);
  };
  tag.onerror=function(){ if(!sudah){ bersih(); selesai(new Error('Tidak bisa menghubungi server.')); } };
  var base=(window.APP_CFG&&APP_CFG.APPS_SCRIPT)||'';
  tag.src=base+'?'+param+'&k='+encodeURIComponent(KODE)+'&callback='+nama+'&_='+Date.now();
  document.head.appendChild(tag);
}
function panggilApi(fn, args, ok, fail){
  var a=JSON.stringify(args||[]);
  var gagal=function(e){
    if(e && e.kodeSalah){ kodeDitolak(); return; }
    if(fail) fail(e); else console.warn(fn, e);
  };
  var berhasil=function(isi){ if(ok) ok(isi?isi.r:undefined); };
  if(encodeURIComponent(a).length<=JSONP_MAX){
    jsonp('fn='+encodeURIComponent(fn)+'&a='+encodeURIComponent(a), function(e,isi){ e?gagal(e):berhasil(isi); });
    return;
  }
  var parts=[], i=0;
  while(i<a.length){ var len=4800; while(len>50 && encodeURIComponent(a.substr(i,len)).length>JSONP_MAX) len=Math.floor(len*0.7); parts.push(a.substr(i,len)); i+=len; }
  var pid=(Date.now().toString(36)+Math.random().toString(36).slice(2,10)).replace(/[^a-z0-9]/gi,'');
  var n=parts.length, next=0, done=0, stop=false;
  var url=function(j){ return 'fn='+encodeURIComponent(fn)+'&pid='+pid+'&i='+j+'&n='+n+'&a='+encodeURIComponent(parts[j]); };
  var terakhir=function(){ jsonp(url(n-1), function(e,isi){ e?gagal(e):berhasil(isi); }); };
  var jalan=function(){
    if(stop) return;
    if(next>=n-1){ if(done>=n-1) terakhir(); return; }
    var j=next++;
    jsonp(url(j), function(e){ if(stop) return; if(e){ stop=true; return gagal(e); } done++; if(done>=n-1) terakhir(); else jalan(); });
  };
  if(n===1) terakhir(); else for(var t=0;t<Math.min(4,n-1);t++) jalan();
}
function srv(){
  if(window.__TEST_RUN) return window.__TEST_RUN();
  var ok=null, fail=null, r={
    withSuccessHandler:function(f){ ok=f; return r; },
    withFailureHandler:function(f){ fail=f; return r; }
  };
  API_FN.forEach(function(n){ r[n]=function(){ panggilApi(n, [].slice.call(arguments), ok, fail); }; });
  return r;
}

var BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agt','Sep','Okt','Nov','Des'];
var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

var DATA=lsGet(DATA_KEY,null);          // {siapa, urutan, orang:{...}, hariIni, _waktu}
var ANTRE=lsGet(ANTRE_KEY,[]);          // pembelian yang belum sampai server
var S={ tab:(/[?&]tab=(transfer)/.exec(location.search)||[0,'barang'])[1], aksi:null, lihat:null, filter:'semua', cari:'', buka:{}, lembar:null, dialog:null, toast:null, memuat:false, galat:null, kodeErr:'' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function rp(n){ return 'Rp'+Math.round(n||0).toLocaleString('id-ID'); }
function tglObj(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function tglPendek(s){ if(!s) return ''; var d=tglObj(s); return d.getDate()+' '+BLN[d.getMonth()]; }
function tglPanjang(s){ var d=tglObj(s); return HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear(); }
function hariIni(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function selisihHari(a,b){ return Math.round((tglObj(b)-tglObj(a))/864e5); }
function jenis(st){ if(st==='Dibatalkan') return 'batal'; if(st==='Sudah Datang'||st==='Sudah Dibayar') return 'datang'; return 'tunggu'; }
function batasCek(){ return (DATA&&DATA.batasCek)||7; }
function perluCek(b){ return !b._antre && jenis(b[5])==='tunggu' && b[0] && selisihHari(b[0],hariIni())>=batasCek(); }
function kunciItem(b){ return (b[7]||0)+'|'+normNo(b[2]); }
function normNo(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^0+/,''); }
function isAdmin(){ return DATA && DATA.siapa==='ADMIN'; }
function orangAktif(){ return isAdmin()? S.lihat : (DATA&&DATA.siapa); }
function namaToko(s){ var o=(DATA&&DATA.urutan||[]).concat(['Erik','Yuswan','Rafi','Fikri','Sri','Agda']); return String(s||'').replace(new RegExp('^\\s*('+o.join('|')+')\\s*/\\s*','i'),''); }
function idBaru(){ return (Date.now().toString(36)+Math.random().toString(36).slice(2,10)).replace(/[^a-z0-9]/gi,''); }
function berapaLalu(iso){
  if(!iso) return ''; var m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<1) return 'baru saja'; if(m<60) return m+' menit lalu'; var j=Math.round(m/60); if(j<24) return j+' jam lalu'; return Math.round(j/24)+' hari lalu';
}

/* ---------- olah data ---------- */
function daftarBeli(nama){
  var o=DATA.orang[nama]; if(!o) return [];
  var ada={}; o.beli.forEach(function(b){ ada[normNo(b[2])]=1; });
  var lokal=ANTRE.filter(function(a){ return a.orang===nama && !ada[normNo(a.no)]; })
    .map(function(a){ var b=[a.tgl,a.jam,a.no,a.penjual,a.harga,'',null,0]; b._antre=a; return b; });
  return lokal.concat(o.beli);
}
function ringkas(nama){
  var o=DATA.orang[nama], c={tunggu:0,datang:0,batal:0};
  daftarBeli(nama).forEach(function(b){ c[jenis(b[5])]++; });
  var bulan={};
  o.sales.forEach(function(s){ var k=s[1].slice(0,7); (bulan[k]=bulan[k]||{k:k,total:0,item:[]}); bulan[k].total+=s[5]||0; bulan[k].item.push(s); });
  var tglCair=o.cair.map(function(x){return x[0];}).filter(Boolean).sort();
  var list=Object.keys(bulan).sort().reverse().map(function(k){
    var b=bulan[k], p=k.split('-'), h=new Date(+p[0],+p[1],0).getDate(), akhir=k+'-'+(h<10?'0':'')+h;
    b.cair=tglCair.some(function(t){ return t>=akhir; });
    b.item.sort(function(a,z){ return z[1]<a[1]?-1:1; });
    return b;
  });
  var r=o.ringkas||{};
  return { c:c, total:r.total||0, cair:r.nominal||0, sekarang:r.sekarang||0, tglCair:r.tglCair, bulan:list };
}
function saring(nama){
  var q=normNo(S.cari), ql=S.cari.trim().toLowerCase();
  var bln=hariIni().slice(0,7);
  return daftarBeli(nama).filter(function(b){
    if(S.filter!=='semua' && jenis(b[5])!==S.filter) return false;

  var a=ANTRE.find(function(x){ return normNo(x.no)===n; }); if(a) return {orang:a.orang,b:[a.tgl,'',a.no,a.penjual]};

}

/* ---------- antrean kirim (jalan di latar, dicoba ulang) ---------- */
var kirimJalan=false, kirimUlangJam=null;
function kirimAntre(){
  if(kirimJalan) return;
  ANTRE.forEach(function(x){ if(x.lampTunggu && !INV_TUNGGU[x.lampTunggu]) pulihkanTunggu(x); });
  var a=ANTRE.find(function(x){ return !x.lampTunggu && (!x.gagal || (!x.duplikat && !x.permanen && Date.now()-(x.gagalPada||0)>15000)); });
  if(!a) return;
  kirimJalan=true;
  srv().withSuccessHandler(function(r){
    kirimJalan=false;
    if(r && r.ok){
      var o=DATA.orang[a.orang];
      if(o){ o.beli.unshift([a.tgl,a.jam,r.no||a.no,r.penjual||a.penjual,a.harga,'',null,r.baris||0]); if(r.lampiran){ (o.lampiran=o.lampiran||{})[normNo(r.no||a.no)]=[a.lampiran.mime]; } }
      if(a.setujuId){ var sj=daftarAju().find(function(x){return x.id===a.setujuId;}); if(sj) sj.lanjut='Dicatat '+(r.no||a.no); }
      ANTRE=ANTRE.filter(function(x){return x.id!==a.id;}); lsSet(ANTRE_KEY,ANTRE); simpanData();
      toast('Tersimpan di tab '+a.orang+' baris '+r.baris+(r.transfer&&r.transfer.ditutup?' · dana ditutup'+(r.transfer.selisih>0?', sisa '+rp(r.transfer.selisih):''):r.transfer&&r.transfer.status?' · permintaan '+(r.transfer.jenis==='Minta dana'?'dana':'ganti uang')+' dikirim':r.transfer&&r.transfer.galat?' · transfer: '+r.transfer.galat:''));
      kirimAntre();
      clearTimeout(muatNanti); muatNanti=setTimeout(function(){ muat(true); },4000);
    } else {
      a.gagal=(r&&r.pesan)||'Tidak disimpan oleh server.'; a.duplikat=!!(r&&r.duplikat); a.gagalPada=Date.now();
      lsSet(ANTRE_KEY,ANTRE); toast(a.gagal,true); kirimAntre();
    }
  }).withFailureHandler(function(e){
    kirimJalan=false;
    a.gagal='Belum terkirim: '+(e&&e.message||e)+' Dicoba lagi otomatis.'; a.gagalPada=Date.now();
    a.permanen=/tidak dikenal|tidak valid|belum diisi/i.test(e&&e.message||'');
    lsSet(ANTRE_KEY,ANTRE); render();
    clearTimeout(kirimUlangJam); kirimUlangJam=setTimeout(kirimAntre,15000);
  }).simpanPembelian({id:a.id, orang:a.orang, tgl:a.tgl, jam:a.jam, no:a.no, penjual:a.penjual, harga:a.harga, lampiran:a.lampiran||null, mintaGanti:a.mintaGanti?1:0, mintaDana:a.mintaDana?1:0, danaId:a.danaId||'', setujuId:a.setujuId||'', totalInv:a.totalInv||0});
  render();
}

var BULAN_INV={JANUARI:1,JAN:1,JANUARY:1,FEBRUARI:2,FEB:2,FEBRUARY:2,MARET:3,MAR:3,MARCH:3,APRIL:4,APR:4,MEI:5,MAY:5,JUNI:6,JUN:6,JUNE:6,JULI:7,JUL:7,JULY:7,
  AGUSTUS:8,AGT:8,AGU:8,AUG:8,AUGUST:8,SEPTEMBER:9,SEP:9,SEPT:9,OKTOBER:10,OKT:10,OCT:10,OCTOBER:10,NOVEMBER:11,NOV:11,DESEMBER:12,DES:12,DEC:12,DECEMBER:12};
function angkaRp(s){ return +String(s).replace(/[^\d]/g,'') || 0; }
function pad2(n){ return (n<10?'0':'')+n; }
function bacaInvoice(teks){
  // jarak lebar (>=2 spasi / tab) = batas kolom, dipertahankan sebagai 3 spasi
  var t=String(teks||'').replace(/\r/g,'').replace(/\u00a0/g,' ').replace(/\t/g,'   ').replace(/ {2,}/g,'   ');
  var T=t.toUpperCase(), baris=t.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  var h={pasar:'', no:'', penjual:'', total:0, tgl:'', jam:''};

  // --- marketplace ---
  if(/TOKOPEDIA|ORDER RECEIPT|\/MPL\//.test(T)) h.pasar='Tokopedia';
  else if(/SHOPEE|NOTA PESANAN/.test(T)) h.pasar='Shopee';
  else if(/\bTOCO\b|INV\s*\/\s*\d{8}\s*\/\s*[A-Z]{2,5}\s*\/\s*\d/.test(T)) h.pasar='Toco';

  // --- No. Pesanan ---
  var m;
  if((m=T.match(/INV\s*\/\s*\d{8}\s*\/\s*MPL\s*\/\s*(\d{6,})/))) h.no=m[1];                         // Tokopedia lama
  else if((m=T.match(/INV\s*\/\s*\d{8}\s*\/\s*[A-Z]{2,5}\s*\/\s*(\d{6,})/))) h.no=m[1];              // Toco
  else if((m=T.match(/ORDER RECEIPT\s*(\d{12,20})/))) h.no=m[1];                                     // Tokopedia
  else if((m=T.match(/NO\.?\s*PESANAN[\s\S]{0,120}?\b(\d{6}[A-Z0-9]{8})\b/))) h.no=m[1];              // Shopee
  else if((m=T.match(/\b(\d{6}[A-Z][A-Z0-9]{7})\b/))) h.no=m[1];
  else if((m=T.match(/\b(5\d{17})\b/))) h.no=m[1];

  // --- nama penjual ---
  var stop=/\s{2,}|\s+(PEMBELI|NAMA PEMBELI|TANGGAL|ALAMAT)\b|$/i;
  for(var i=0;i<baris.length && !h.penjual;i++){
    var b=baris[i], k=b.search(/(NAMA\s+PENJUAL|PENJUAL|TOKO|SELLER)\s*:/i);
    if(k<0) continue;
    var sisa=b.slice(k).replace(/^(NAMA\s+PENJUAL|PENJUAL|TOKO|SELLER)\s*:\s*/i,'');
    var ambil=sisa.split(stop)[0].trim();
    if(!ambil || /^(PEMBELI|NAMA PEMBELI|TANGGAL)/i.test(ambil)){           // nilai ada di baris bawahnya (Toco)
      var nx=(baris[i+1]||'').replace(/^(PENJUAL|PEMBELI)\s*:\s*/i,'');
      ambil=nx.split(/\s{2,}/)[0].trim();
    }
    if(ambil && !/^RP/i.test(ambil)) h.penjual=ambil.replace(/[:|]+$/,'').trim();
  }

  // --- total bayar (Harga Beli) ---
  var kunci=['TOTAL TAGIHAN','TOTAL PEMBAYARAN','TOTAL BAYAR','TOTAL BELANJA','TOTAL PESANAN'];
  for(var j=0;j<kunci.length && !h.total;j++){
    var re=new RegExp(kunci[j]+'[^\\d]{0,40}?RP\\s*([\\d.,]+)','g'), mm, last=null;
    while((mm=re.exec(T))) last=mm;
    if(last) h.total=angkaRp(last[1].replace(/,\d{2}$/,''));
  }

  // --- tanggal & jam ---
  var bl=Object.keys(BULAN_INV).join('|');
  if((m=T.match(new RegExp('\\b(\\d{1,2})\\s+('+bl+')\\.?\\s+(20\\d{2})\\b')))) h.tgl=m[3]+'-'+pad2(BULAN_INV[m[2]])+'-'+pad2(+m[1]);
  else if((m=T.match(/\b(\d{2})[\/\-](\d{2})[\/\-](20\d{2})\b/))) h.tgl=m[3]+'-'+m[2]+'-'+m[1];
  else if((m=T.match(/\b(20\d{2})[\/\-](\d{2})[\/\-](\d{2})\b/))) h.tgl=m[1]+'-'+m[2]+'-'+m[3];
  if((m=T.match(/\b([01]?\d|2[0-3])[:.]([0-5]\d)(?::\d{2})?\s*(WIB)?\b/)) && !/\d[:.]\d{2}[:.]\d{2}[:.]/.test(m[0])) h.jam=pad2(+m[1])+':'+m[2];
  return h;
}

var PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
var pdfSiap=null;
function muatPdfJs(){
  if(pdfSiap) return pdfSiap;
  pdfSiap=new Promise(function(ok,gagal){
    var t=document.createElement('script'); t.src=PDFJS+'pdf.min.js';
    t.onload=function(){ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; }catch(e){} ok(window.pdfjsLib); };
    t.onerror=function(){ pdfSiap=null; gagal(new Error('Pembaca PDF tidak bisa dimuat. Periksa internet.')); };
    document.head.appendChild(t);
  });
  return pdfSiap;
}
function bacaBuffer(file){ return new Promise(function(ok,gagal){ var r=new FileReader(); r.onload=function(){ ok(r.result); }; r.onerror=function(){ gagal(new Error('File tidak bisa dibaca.')); }; r.readAsArrayBuffer(file); }); }
function keBase64(buf){ var b=new Uint8Array(buf), s='', k=0x8000; for(var i=0;i<b.length;i+=k) s+=String.fromCharCode.apply(null,b.subarray(i,i+k)); return btoa(s); }
function teksDariPdf(pdf){
  var out=[], n=Math.min(pdf.numPages,3), p=Promise.resolve();
  for(var i=1;i<=n;i++) (function(i){ p=p.then(function(){ return pdf.getPage(i); }).then(function(pg){ return pg.getTextContent(); }).then(function(tc){
    var it=tc.items.filter(function(x){return x.str!==undefined;}).map(function(x){return {s:x.str,x:x.transform[4],y:x.transform[5],w:x.width};});
    it.sort(function(a,b){ return Math.abs(b.y-a.y)>3?b.y-a.y:a.x-b.x; });
    var baris=[],cur=null;
    it.forEach(function(x){ if(!cur||Math.abs(cur.y-x.y)>3){cur={y:x.y,it:[]};baris.push(cur);} cur.it.push(x); });
    baris.forEach(function(b){ b.it.sort(function(a,c){return a.x-c.x;}); var s='',ujung=null; b.it.forEach(function(x){ if(ujung!==null){ var g=x.x-ujung; s+=g>8?'   ':g>1.5?' ':''; } s+=x.s; ujung=x.x+x.w; }); out.push(s); });
  }); })(i);
  return p.then(function(){ return out.join('\n'); });
}
function gambarKeJpeg(sumber, lebar, tinggi, maks, mutu){
  var sk=Math.min(1, maks/Math.max(lebar,tinggi)), c=document.createElement('canvas');
  c.width=Math.round(lebar*sk); c.height=Math.round(tinggi*sk);
  var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(sumber,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',mutu||0.82);
}
function thumbDari(dataUrl){ return new Promise(function(ok){ var im=new Image(); im.onload=function(){ ok(gambarKeJpeg(im,im.width,im.height,160,0.7)); }; im.onerror=function(){ ok(''); }; im.src=dataUrl; }); }
/** file -> { mime, data(base64), preview(base64|''), teks(pdf)|'' , thumb } */
function siapkanFile(file){
  var mime=file.type||'';
  if(/pdf$/i.test(file.name||'')) mime='application/pdf';
  if(mime==='application/pdf'){
    if(file.size>4*1024*1024) return Promise.reject(new Error('PDF terlalu besar (maks 4 MB).'));
    var buf;
    return bacaBuffer(file).then(function(b){ buf=b; return muatPdfJs(); })
      .then(function(lib){ return lib.getDocument({data:new Uint8Array(buf.slice(0)), isEvalSupported:false}).promise; })
      .then(function(pdf){
        return teksDariPdf(pdf).then(function(teks){
          return pdf.getPage(1).then(function(pg){
            var vp0=pg.getViewport({scale:1}), vp=pg.getViewport({scale:Math.min(2.2,1200/vp0.width)});
            var c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
            var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
            return pg.render({canvasContext:g, viewport:vp}).promise.then(function(){
              var pv=c.toDataURL('image/jpeg',0.8);
              return thumbDari(pv).then(function(th){ return {mime:mime, data:keBase64(buf), preview:pv.split(',')[1], teks:teks, thumb:th}; });
            });
          });
        });
      });
  }
  if(!/^image\//.test(mime)) return Promise.reject(new Error('Pilih file PDF atau gambar.'));
  return new Promise(function(ok,gagal){
    var url=URL.createObjectURL(file), im=new Image();
    im.onload=function(){ var j=gambarKeJpeg(im,im.naturalWidth,im.naturalHeight,1600,0.82); URL.revokeObjectURL(url);
      thumbDari(j).then(function(th){ ok({mime:'image/jpeg', data:j.split(',')[1], preview:'', teks:'', thumb:th}); }); };
    im.onerror=function(){ URL.revokeObjectURL(url); gagal(new Error('Gambar tidak bisa dibuka.')); };
    im.src=url;
  });
}
/** Kirim lewat POST (cepat), tanyakan hasilnya; kalau gagal, pakai jalur JSONP terpotong. */
function unggah(d, selesai){
  var base=(window.APP_CFG&&APP_CFG.APPS_SCRIPT)||'', mulai=Date.now(), sudah=false;
  function akhir(e,r){ if(sudah) return; sudah=true; selesai(e,r); }
  function cadangan(){ srv().withSuccessHandler(function(r){ akhir(null,r); }).withFailureHandler(function(e){ akhir(e); }).unggahInvoice(d); }
  if(window.__TEST_RUN || !window.fetch || !base){ cadangan(); return; }
  function tanya(){
    if(sudah) return;
    if(Date.now()-mulai>45000){ cadangan(); return; }
    srv().withSuccessHandler(function(r){ if(r&&r.menunggu) setTimeout(tanya,900); else akhir(null,r); })
      .withFailureHandler(function(e){ akhir(e); }).hasilPost(d.id);
  }
  fetch(base,{method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({k:KODE, fn:'unggahInvoice', id:d.id, d:d})})
    .then(function(){ setTimeout(tanya,600); }).catch(function(){ cadangan(); });
}
var modePilih=null, panasTerakhir=0;
/* bangunkan server selagi karyawan memilih file, supaya unggahan tidak menunggu server "bangun" */
function panaskan(){ if(window.__TEST_RUN||Date.now()-panasTerakhir<60000) return; panasTerakhir=Date.now(); try{ srv().withSuccessHandler(function(){}).withFailureHandler(function(){}).hasilPost('panaskan'); }catch(e){} }
function pilihFile(mode){
  panaskan();
  modePilih=mode; var inp=document.getElementById('fileInv'); inp.value=''; inp.click();

  else if(mode.jenis==='trf'){ if(S.ftrf){ S.ftrf.file={}; unggahFileTrf(f,S.ftrf.file,DATA.siapa); } }

  else if(mode.jenis==='dana'){ if(S.fdana) unggahDana(f); }
  else if(mode.jenis==='buktikomisi'){ if(S.dialog&&S.dialog.jenis==='cair'){ S.dialog.bukti={}; unggahFileTrf(f,S.dialog.bukti,S.dialog.orang); } }
  else if(mode.jenis==='buktitf'){ if(S.dialog&&S.dialog.jenis==='batal'){ S.dialog.buktiTf={}; unggahFileTrf(f,S.dialog.buktiTf,S.dialog.orang); } }
  else if(mode.jenis==='buktibatal'){ if(S.dialog&&S.dialog.jenis==='batal'){ S.dialog.bukti={}; unggahFileTrf(f,S.dialog.bukti,S.dialog.orang); } }
  else if(mode.jenis==='bukti'){ if(S.dialog&&S.dialog.jenis==='trfok'){ S.dialog.bukti={}; unggahFileTrf(f,S.dialog.bukti,S.dialog.t.orang); } }
  else invUntukItem(f,mode);
});
function isiForm(h){
  var f=document.getElementById('formCatat'); if(!f) return [];
  var terisi=[];
  function set(n,v){ if(!v) return; var i=f.querySelector('[name='+n+']'); if(!i) return; i.value=v; i.classList.add('terisi'); terisi.push(n); i.dispatchEvent(new Event('input')); }
  set('tgl',h.tgl); set('jam',h.jam); set('no',h.no); set('penjual',h.penjual); if(h.total) set('harga',String(h.total));
  if(S.inv) S.inv.terisi=terisi;
  return terisi;
}
function ringkasBaca(h){
  var ada=[h.no&&'No. Pesanan',h.penjual&&'penjual',h.total&&'total',h.tgl&&'tanggal'].filter(Boolean);
  if(!ada.length) return '<span class="o">Teks tidak terbaca, isi manual ya.</span>';
  return (h.pasar?h.pasar+': ':'')+'terisi '+ada.join(', ')+'. Cek lagi sebelum simpan.';
}

/* ---------- tugas latar: kirim formulir walau foto masih diunggah ---------- */
var TUGAS_KEY='pgnet_sl_tugas', TUGAS=lsGet(TUGAS_KEY,[]), UPLOAD={};
TUGAS.forEach(function(t){ Object.keys(t).forEach(function(k){ if(k.charAt(0)==='_') delete t[k]; }); });
function fileSiap(x){ return x&&x.hasil?{fileId:x.hasil.fileId, previewId:x.hasil.previewId||'', mime:x.hasil.mime}:null; }
function fileJalan(x){ return !!(x && !x.hasil && x.status!=='gagal' && x.upId); }
function fileOk(x){ return !!(x && (x.status==='siap' || fileJalan(x))); }
function simpanTugas(){ lsSet(TUGAS_KEY, TUGAS.map(function(t){ var o={}; Object.keys(t).forEach(function(k){ if(k.charAt(0)!=='_') o[k]=t[k]; }); return o; })); }
function tugasBaru(fn, arg, berkas, label, pesanOk){
  var t={id:idBaru(), fn:fn, arg:arg, tunggu:{}, label:label, ok:pesanOk, dibuat:Date.now()};
  Object.keys(berkas||{}).forEach(function(k){ var x=berkas[k]; if(!x) return; if(x.hasil) arg[k]=fileSiap(x); else if(x.upId) t.tunggu[k]=x.upId; });
  TUGAS.push(t); simpanTugas(); jalankanTugas();
}
function hapusTugas(t){ TUGAS=TUGAS.filter(function(x){ return x!==t; }); simpanTugas(); }
function tugasGagal(t, m){ hapusTugas(t); toast(t.label+' belum terkirim: '+m+' Silakan ulangi.', true); if(KODE&&DATA) muat(true); }
function pulihUpload(t, k){
  if(t['_p'+k]) return; t['_p'+k]=1; var coba=0, upId=t.tunggu[k];
  (function tanya(){
    srv().withSuccessHandler(function(r){
      if(r&&r.menunggu&&++coba<25){ setTimeout(tanya,1500); return; }
      if(r&&r.fileId){ t.arg[k]={fileId:r.fileId, previewId:r.previewId||'', mime:r.mime}; delete t.tunggu[k]; simpanTugas(); jalankanTugas(); }
      else tugasGagal(t,'foto tidak ditemukan di server.');
    }).withFailureHandler(function(e){ tugasGagal(t,(e&&e.message)||'foto gagal terunggah.'); }).hasilPost(upId);
  })();
}
function jalankanTugas(){
  if(!KODE) return;
  TUGAS.slice().forEach(function(t){
    if(t._jalan) return;
    var sisa=0, gagal='';
    Object.keys(t.tunggu||{}).forEach(function(k){
      var u=UPLOAD[t.tunggu[k]];
      if(u){ if(u.hasil){ t.arg[k]=fileSiap(u); delete t.tunggu[k]; } else if(u.status==='gagal') gagal=u.galat||'foto gagal terunggah.'; else sisa++; }
      else { sisa++; pulihUpload(t,k); }
    });
    if(gagal){ tugasGagal(t,gagal); return; }
    if(sisa) return;
    t._jalan=true; simpanTugas();
    srv().withSuccessHandler(function(){ hapusTugas(t); toast(t.ok); muat(true); })
      .withFailureHandler(function(e){
        t._jalan=false; var m=(e&&e.message)||String(e); t.coba=(t.coba||0)+1;
        if(/fetch|jaringan|network|timeout|koneksi|sibuk|internet/i.test(m) && t.coba<5){ simpanTugas(); setTimeout(jalankanTugas,6000); }
        else tugasGagal(t,m);
      })[t.fn](t.arg);
  });
}

var INV_TUNGGU={};   // unggahan invoice yang masih berjalan, dikunci dengan id unggahan
function invUntukForm(file){
  var nama=orangAktif(), id=idBaru();
  var inv=S.inv={status:'baca', nama:file.name, mime:file.type, upId:id}; INV_TUNGGU[id]=inv; render();
  function aktif(){ return S.inv===inv; }
  siapkanFile(file).then(function(p){
    inv.thumb=p.thumb; inv.mime=p.mime;
    var h=p.teks?bacaInvoice(p.teks):null;
    inv.status='unggah'; if(h){ inv.baca=h; inv.info=ringkasBaca(h); }
    if(aktif()){ render(); if(h) isiForm(h); }
    unggah({id:id, orang:nama, nama:file.name, mime:p.mime, data:p.data, preview:p.preview, ocr:!p.teks}, function(e,r){
      if(e){ inv.status='gagal'; inv.galat='Invoice belum tersimpan: '+(e.message||e)+' Tekan × lalu coba lagi.'; if(aktif()) render(); lepasTunggu(id); return; }
      inv.status='siap'; inv.hasil=r;
      if(!h && r.teks){ var h2=bacaInvoice(r.teks); inv.baca=h2; inv.info=ringkasBaca(h2); if(aktif()){ render(); isiForm(h2); } }
      else { if(!h) inv.info='<span class="o">Teks screenshot tidak terbaca, isi manual ya.</span>'; if(aktif()) render(); }
      lepasTunggu(id);
    });
  }).catch(function(e){ inv.status='gagal'; inv.galat=e.message||String(e); if(aktif()) render(); lepasTunggu(id); });
}
/* invoice selesai (atau gagal) → pasang ke pembelian di antrean yang menunggunya, lalu kirim */
function lepasTunggu(id){
  var inv=INV_TUNGGU[id], ada=false;
  ANTRE.forEach(function(a){
    if(a.lampTunggu!==id) return; ada=true; delete a.lampTunggu;
    if(inv && inv.status==='siap' && inv.hasil){ a.lampiran={fileId:inv.hasil.fileId, previewId:inv.hasil.previewId||'', mime:inv.hasil.mime}; if(!a.totalInv && inv.baca && inv.baca.total) a.totalInv=inv.baca.total; }
    else pasangGagal(a);
  });
  if(S.inv!==inv) delete INV_TUNGGU[id];
  if(ada){ lsSet(ANTRE_KEY,ANTRE); render(); kirimAntre(); }
}
function pasangGagal(a){
  a.lampiran=null;
  if(a.danaId){ a.gagal='Invoice gagal terunggah, jadi dana belum bisa ditutup. Hapus catatan ini lalu catat ulang dengan invoice.'; a.permanen=true; a.gagalPada=Date.now(); }
  else toast('Pembelian '+a.no+' tetap disimpan, tapi invoicenya gagal terunggah. Lampirkan ulang dari daftar barang.',true);
}
/* halaman sempat ditutup saat invoice masih diunggah: ambil hasilnya dari server */
function pulihkanTunggu(a){
  if(a._pulih) return; a._pulih=true; var coba=0;
  (function tanya(){
    srv().withSuccessHandler(function(r){
      if(r&&r.menunggu&&++coba<20){ setTimeout(tanya,1500); return; }
      delete a.lampTunggu; delete a._pulih;
      if(r&&r.fileId) a.lampiran={fileId:r.fileId, previewId:r.previewId||'', mime:r.mime}; else pasangGagal(a);
      lsSet(ANTRE_KEY,ANTRE); render(); kirimAntre();
    }).withFailureHandler(function(){ delete a.lampTunggu; delete a._pulih; pasangGagal(a); lsSet(ANTRE_KEY,ANTRE); render(); kirimAntre(); }).hasilPost(a.lampTunggu);
  })();
}
function invUntukItem(file, mode){
  var b=mode.b, id=idBaru();
  toast('Menyiapkan invoice…');
  siapkanFile(file).then(function(p){
    var h=p.teks?bacaInvoice(p.teks):null;
    toast('Menyimpan invoice ke Drive…');
    unggah({id:id, orang:mode.orang, nama:file.name, mime:p.mime, data:p.data, preview:p.preview, ocr:!p.teks}, function(e,r){
      if(e){ toast('Invoice belum tersimpan: '+(e.message||e), true); return; }
      var noInv=(h&&h.no)||(r.teks&&bacaInvoice(r.teks).no)||'';
      var dl={jenis:'lampbeda', b:b, orang:mode.orang, noInv:noInv, lampiran:{fileId:r.fileId, previewId:r.previewId||'', mime:r.mime}};
      if(noInv && normNo(noInv)!==normNo(b[2])){ S.dialog=dl; render(); } else pasangLamp(dl);
    });
  }).catch(function(e){ toast(e.message||String(e), true); });
}
function pasangLamp(dl){
  if(!dl||dl.jalan) return; dl.jalan=true; if(S.dialog===dl) render();
  srv().withSuccessHandler(function(){
    var o=DATA.orang[dl.orang]; (o.lampiran=o.lampiran||{})[normNo(dl.b[2])]=[dl.lampiran.mime]; simpanData();
    if(S.dialog===dl) S.dialog=null;
    toast('Invoice terlampir ke '+namaToko(dl.b[3]));
  }).withFailureHandler(function(e){
    dl.jalan=false; if(S.dialog===dl){ dl.galat=e.message||String(e); render(); } else toast(e.message||String(e), true);
  }).pasangLampiran({orang:dl.orang, baris:dl.b[7], no:dl.b[2], lampiran:dl.lampiran});

  var rk=TIM.rekap||{}, daftar=Object.keys(rk).sort(), ini=hariIni().slice(0,7);
  if(daftar.indexOf(ini)<0) daftar.push(ini);
  var i=S.rekapI==null?daftar.length-1:Math.max(0,Math.min(daftar.length-1,S.rekapI)), w=daftar[i], data=rk[w]||{};
  var lalu=daftar[i-1], dataL=lalu&&rk[lalu]||{};
  var org=(DATA.urutan&&DATA.urutan.length>1?DATA.urutan:['Erik','Yuswan','Rafi','Fikri','Sri','Agda']).slice();
  org.sort(function(a,b){ var x=data[a]||[0,0,0], y=data[b]||[0,0,0]; return y[2]-x[2]||y[1]-x[1]||y[0]-x[0]; });
  var maks=Math.max.apply(null,[1].concat(org.map(function(n){ return (data[n]||[0,0,0])[2]; })));
  var tot=[0,0,0]; org.forEach(function(n){ (data[n]||[0,0,0]).forEach(function(v,k){ tot[k]+=v; }); });
  var medali=['🥇','🥈','🥉'], modeK=S.rekapMode==='komisi';
  var pilih='<div class="rk-mode"><button class="'+(modeK?'':'on')+'" data-rekapmode="laku">Barang laku</button><button class="'+(modeK?'on':'')+'" data-rekapmode="komisi">🏆 Komisi</button></div>';
  if(modeK){
    var uk=(TIM.urutKomisi||{})[w]||[], sisa=org.filter(function(n){ return uk.indexOf(n)<0; });
    var komKu=0; ((DATA.orang[DATA.siapa]||{sales:[]}).sales).forEach(function(s){ if(s[1].slice(0,7)===w) komKu+=s[5]||0; });
    var ukL=(TIM.urutKomisi||{})[lalu]||[];
    return '<div class="kartu rekap-tim">'+kepalaRekap(i,daftar,w,ini,tot)+pilih
      +(uk.length?uk.map(function(n,k){ var aku=n===DATA.siapa; return '<div class="rk-baris k'+(aku?' aku':'')+'"><span class="rk-no">'+(k<3?medali[k]:(k+1))+'</span><span class="rk-nm">'+esc(n)+'</span><span class="rk-lalu">'+(lalu?(ukL.indexOf(n)>=0?'bln lalu #'+(ukL.indexOf(n)+1):'bln lalu –'):'')+'</span><b>'+(aku&&!isAdmin()?rp(komKu):'')+'</b></div>'; }).join('')
        :'<div class="kosong" style="padding:12px">Belum ada komisi bulan ini.</div>')
      +(sisa.length&&uk.length?'<div class="l" style="margin-top:6px">Belum ada komisi: '+sisa.map(esc).join(', ')+'</div>':'')
      +'<div class="l" style="margin-top:8px">Urutan dari komisi barang yang laku bulan itu. Nominal hanya terlihat oleh pemiliknya.</div></div>';
  }
  return '<div class="kartu rekap-tim">'+kepalaRekap(i,daftar,w,ini,tot)+pilih
    +org.map(function(n,k){ var a=data[n]||[0,0,0], aku=n===DATA.siapa;
      return '<div class="rk-baris'+(aku?' aku':'')+'"><span class="rk-no">'+(a[2]&&k<3?medali[k]:(k+1))+'</span><span class="rk-nm">'+esc(n)+'</span>'
        +'<span class="rk-bar"><i style="width:'+Math.round(a[2]/maks*100)+'%"></i></span><b>'+a[2]+'</b><span class="rk-kecil">'+a[0]+' berhasil · '+a[1]+' batal'+(lalu?' · bln lalu laku '+((dataL[n]||[0,0,0])[2])+' pcs':'')+'</span></div>'; }).join('')
    +'<div class="l" style="margin-top:8px">Rekap bulan lalu dikirim ke HP tiap tanggal 1 pagi. Komisi hanya terlihat oleh pemiliknya.</div></div>';
}

/* ---------- menerima dari tombol "Bagikan" HP ---------- */
var BAGIKAN=null;   // {file, teks}
function ambilBagikan(){
  if(!/[?&]bagikan=1/.test(location.search) || !window.caches) return Promise.resolve();
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  return caches.open('sl-bagikan').then(function(c){
    return c.match('./_bagikan_meta').then(function(r){ return r?r.json():null; }).then(function(m){
      if(!m) return;
      var jadi=function(file){ BAGIKAN={teks:m.teks||'', judul:m.judul||'', isi:m.isi||'', file:file}; c.delete('./_bagikan_meta'); c.delete('./_bagikan_file'); };
      if(!m.ada) return jadi(null);
      return c.match('./_bagikan_file').then(function(r){ return r?r.blob():null; }).then(function(b){
        jadi(b?new File([b], m.nama||('bagikan.'+(/pdf/.test(m.tipe)?'pdf':'jpg')), {type:m.tipe||b.type}):null); });
    });
  }).catch(function(){});
}
function bagiKeCatat(file){ S.dialog=null; S.tab='barang'; S.lembar='catat'; S.anim=true; S.inv=null; S.danaId=null; S.setujuId=null; render(); invUntukForm(file); }
function bagiKeAju(file, ket){ S.dialog=null; S.tab='transfer'; S.faju={id:idBaru(), keterangan:ket||''}; S.lembar='aju'; S.anim=true; if(file){ S.faju.file={}; unggahFileTrf(file,S.faju.file,DATA.siapa); } else render(); }
function pakaiBagikan(){
  if(!BAGIKAN||!KODE||!DATA) return;
  var b=BAGIKAN; BAGIKAN=null; S.lihat=null; S.dialog=null;
  if(b.file){
    if(isAdmin()){ toast('File dibagikan ke akun admin. Catat pembelian dan pengajuan dilakukan dari akun karyawan.',true); return; }
    if(/pdf/i.test(b.file.type||b.file.name)){ bagiKeCatat(b.file); return; }
    S.dialog={jenis:'bagipilih', file:b.file}; S.anim=true; render(); return;
  }
  var teks=String(b.teks||'').replace(/\s+/g,' ').trim();
  if(teks && !isAdmin()){ bagiKeAju(null, teks); toast('Link diterima. Tambahkan screenshot barangnya lalu kirim ke Hani.'); return; }
  toast('Yang dibagikan tidak berisi file atau link.',true);
}

/* ---------- muat data ---------- */
var muatNanti=null;
function simpanData(){ lsSet(DATA_KEY,DATA); }
function muat(diam){
  if(!KODE||S.memuat) return;
  S.memuat=true; if(!diam) S.galat=null; render();
  srv().withSuccessHandler(function(d){
    S.memuat=false; S.galat=null;
    d._waktu=new Date().toISOString(); DATA=d; simpanData();
    if(S.lihat && !DATA.orang[S.lihat]) S.lihat=null;
    setBadge(); render(); kirimAntre(); jalankanTugas(); pakaiBagikan();
  }).withFailureHandler(function(e){
    S.memuat=false; S.galat=(e&&e.message)||String(e); render();
  }).getData();
}
function kodeDitolak(){
  KODE=''; lsDel(KODE_KEY); DATA=null; lsDel(DATA_KEY); S.memuat=false; kirimJalan=false;
  S.kodeErr='Kode akses salah atau sudah diganti. Minta kode baru ke Hani.'; render();
}
function pasangKode(){
  var i=document.getElementById('kodeInput'); if(!i) return;
  var ok=document.getElementById('kodeOk');
  function masuk(){ var k=i.value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(k.length<8){ S.kodeErr='Kode terdiri dari 8 huruf/angka.'; render(); return; }
    KODE=k; lsSet(KODE_KEY,k); S.kodeErr=''; DATA=null; render(); muat(); }
  ok.addEventListener('click',masuk); i.addEventListener('keydown',function(e){ if(e.key==='Enter') masuk(); });
  i.addEventListener('input',function(){ var v=i.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8); i.value=v.length>4?v.slice(0,4)+'-'+v.slice(4):v; });
}

/* ---------- klik ---------- */
document.getElementById('app').addEventListener('click',function(e){
  var t=e.target.closest('button,[data-tirai],[data-menu],[data-item]'); if(!t) return;
  if(t.hasAttribute('data-tirai') && e.target!==t) return;
  var d=t.dataset;
  if(t.hasAttribute('data-bagicatat')&&S.dialog&&S.dialog.file){ bagiKeCatat(S.dialog.file); return; }
  if(t.hasAttribute('data-bagiaju')&&S.dialog&&S.dialog.file){ bagiKeAju(S.dialog.file,''); return; }
  if(t.hasAttribute('data-buktibatal')&&S.dialog&&S.dialog.jenis==='batal'){ pilihFile({jenis:'buktibatal'}); return; }
  if(t.hasAttribute('data-buktibatalhapus')&&S.dialog){ S.dialog.bukti=null; render(); return; }
  if(t.hasAttribute('data-buktikomisi')&&S.dialog&&S.dialog.jenis==='cair'){ pilihFile({jenis:'buktikomisi'}); return; }
  if(t.hasAttribute('data-buktikomisihapus')&&S.dialog){ S.dialog.bukti=null; render(); return; }
  if(d.buktical){ bukaBuktiCair(d.buktical, d.orang||orangAktif(), d.ket||''); return; }
  if(t.hasAttribute('data-buktitf')&&S.dialog&&S.dialog.jenis==='batal'){ pilihFile({jenis:'buktitf'}); return; }
  if(t.hasAttribute('data-buktitfhapus')&&S.dialog){ S.dialog.buktiTf=null; render(); return; }
  if(d.lihattfbatal){ var bb3=cariItem(orangAktif(),d.lihattfbatal); if(bb3) bukaInvoice(bb3,false,'tf'); return; }
  if(d.lihatbatal){ var bb2=cariItem(orangAktif(),d.lihatbatal); if(bb2) bukaInvoice(bb2,false,true); return; }
  if(d.catatmode){ S.catatMode=d.catatmode; render(); return; }
  if(t.hasAttribute('data-danafile')){ pilihFile({jenis:'dana'}); return; }
  if(t.hasAttribute('data-danafilehapus')){ if(S.fdana) S.fdana.file=null; render(); return; }
  if(t.hasAttribute('data-kirimdana')){ kirimDana(); return; }
  if(klikAju(t,d)) return;
  if(klikTrf(t,d)) return;
  if(d.filter){ S.filter=d.filter; }
  else if(d.lipat){ S.buka[d.lipat]=!S.buka[d.lipat]; }
  else if(d.bulan){ S.buka['b'+d.bulan]=!S.buka['b'+d.bulan]; }
  else if(t.hasAttribute('data-bukacatat')){ S.lembar='catat'; S.anim=true; panaskan(); }
  else if(t.hasAttribute('data-bukakomisi')){ S.lembar='komisi'; S.anim=true; }
  else if(t.hasAttribute('data-tutup')||t.hasAttribute('data-tirai')){ if(S.dialog&&S.dialog.jalan) return; if(S.dialog) S.dialog=null; else { S.lembar=null; S.lihat_inv=null; } }
  else if(t.hasAttribute('data-muat')){ muat(); return; }
  else if(t.hasAttribute('data-menu')){ S.dialog={jenis:'menu'}; S.anim=true; }
  else if(t.hasAttribute('data-keluar')){ KODE=''; lsDel(KODE_KEY); DATA=null; lsDel(DATA_KEY); S.dialog=null; S.lihat=null; S.kodeErr=''; }
  else if(d.lihat){ S.lihat=d.lihat; S.filter='semua'; S.cari=''; S.buka={}; }
  else if(t.hasAttribute('data-kembali')){ S.lihat=null; S.lembar=null; }
  else if(d.hapus){ ANTRE=ANTRE.filter(function(x){return x.id!==d.hapus;}); lsSet(ANTRE_KEY,ANTRE); }
  else if(d.cairkan){ S.dialog={jenis:'cair', orang:d.cairkan, id:idBaru(), nominal:ringkas(d.cairkan).sekarang}; S.anim=true; }
  else if(t.hasAttribute('data-yakin')){ cairkan(); return; }
  else if(d.batal){ var bb=cariItem(orangAktif(),d.batal); if(!bb) return; S.dialog={jenis:'batal', orang:orangAktif(), b:bb, id:idBaru(), wajib:hariIni()>=MULAI_FITUR, perluTf:hariIni()>=MULAI_FITUR&&!isAdmin()}; S.anim=true; }
  else if(t.hasAttribute('data-yakinbatal')){ tandaiBatal(); return; }
  else if(d.item){ S.aksi=(S.aksi===d.item?null:d.item); }
  else if(t.hasAttribute('data-pilihinv')){ pilihFile({jenis:'form'}); return; }
  else if(t.hasAttribute('data-hapusinv')){ S.inv=null; }
  else if(d.lampirkan){ var bl=cariItem(orangAktif(),d.lampirkan); if(bl) pilihFile({jenis:'item', b:bl, orang:orangAktif()}); return; }
  else if(d.lihatinv){ var bv=cariItem(orangAktif(),d.lihatinv); if(bv) bukaInvoice(bv,false); return; }
  else if(t.hasAttribute('data-invasli')){ if(S.lihat_inv) bukaInvoice(S.lihat_inv.b,true,S.lihat_inv.batal); return; }
  else if(t.hasAttribute('data-bukapdf')){ bukaPdf(); return; }
  else if(t.hasAttribute('data-yakinlamp')){ pasangLamp(S.dialog); return; }
  else return;
  render();
});
function klikTrf(t,d){
  var has=function(a){ return t.hasAttribute(a); };
  if(d.tab){ S.tab=d.tab; S.lembar=null; S.dialog=null; if(d.tab==='tim'&&TIM&&Date.now()-new Date(TIM._waktu)>10*60000) muatTim(true); try{ document.querySelector('.isi').scrollTop=0; }catch(e){} }
  else if(has('data-muattim')){ muatTim(); muat(true); return true; }
  else if(d.timf){ var p=d.timf.split('|'); S.timF[p[0]]=(S.timF[p[0]]===p[1]?'':p[1]); S.timBatas=80; }
  else if(d.rekap!=null && t.hasAttribute('data-rekap')){ S.rekapI=+d.rekap; }
  else if(d.rekapmode){ S.rekapMode=d.rekapmode; }
  else if(has('data-rekapbuka')){ lsSet('pgnet_sl_rekapbuka',!lsGet('pgnet_sl_rekapbuka',false)); }
  else if(has('data-timlagi')){ S.timBatas=(S.timBatas||80)+120; }
  else if(has('data-notif')){ aktifkanNotif(); return true; }
  else if(has('data-rek')){ S.lembar='rek'; S.frek=null; S.anim=true; }
  else if(has('data-simpanrek')){ simpanRek(); return true; }
  else if(has('data-bukadana')){ S.ftrf={jenis:'dana', id:idBaru()}; S.lembar='trf'; S.anim=true; }
  else if(has('data-bukarefund')){ S.ftrf={jenis:'refund', id:idBaru()}; S.lembar='trf'; S.anim=true; }
  else if(d.refund){ var tr=daftarTrf().find(function(x){return x.id===d.refund;}); S.ftrf={jenis:'refund', id:idBaru(), no:tr.no, nominal:rp(tr.selisih), catatan:'Sisa dana '+(tr.penjual||'')}; S.lembar='trf'; S.anim=true; }
  else if(d.saranrf){ ambilFormTrf(); var q=d.saranrf.split('|'); S.ftrf.no=q[0]; S.ftrf.nominal=rp(+q[1]); }
  else if(has('data-trffile')){ ambilFormTrf(); pilihFile({jenis:'trf'}); return true; }
  else if(has('data-trffilehapus')){ ambilFormTrf(); S.ftrf.file=null; }
  else if(has('data-kirimtrf')){ kirimTrf(); return true; }
  else if(d.trflihat){ var z=d.trflihat.split('|'); bukaFileTrf(z[0],z[1],false); return true; }
  else if(has('data-invasli') && S.lihat_inv && S.lihat_inv.trf){ bukaFileTrf(S.lihat_inv.trf.id,S.lihat_inv.trf.apa,true); return true; }
  else if(d.trfok||d.trfmasuk||d.trftolak){ var id=d.trfok||d.trfmasuk||d.trftolak, tt=daftarTrf().find(function(x){return x.id===id;}); if(!tt) return true; S.dialog={jenis:d.trfok?'trfok':d.trfmasuk?'trfmasuk':'trftolak', t:tt}; S.anim=true; }
  else if(has('data-buktifile')){ pilihFile({jenis:'bukti'}); return true; }
  else if(has('data-yakintrf')){ prosesTrf('ditransfer'); return true; }
  else if(has('data-yakinmasuk')){ prosesTrf('masuk'); return true; }
  else if(has('data-yakintolak')){ prosesTrf('tolak'); return true; }
  else if(d.salin){ salin(d.salin); return true; }
  else if(d.trfinv){ S.danaId=d.trfinv; S.catatMode=null; S.tab='barang'; S.lembar='catat'; S.anim=true; S.inv=null; }
  else if(d.mintaganti){ mintaGanti(d.mintaganti); return true; }
  else if(has('data-bukacatat')){ S.danaId=null; S.setujuId=null; S.catatMode=null; S.fdana=null; return false; }
  else return false;
  render(); return true;
}
function mintaGanti(k){
  var b=cariItem(orangAktif(),k); if(!b) return;
  if(!rekOrang(DATA.siapa)){ toast('Isi rekeningmu dulu di tab Transfer.',true); return; }
  toast('Mengirim permintaan ganti uang…');
  srv().withSuccessHandler(function(){ toast('Permintaan ganti '+rp(b[4])+' dikirim ke '+petugasNama()); S.aksi=null; muat(true); })
    .withFailureHandler(function(e){ toast(e.message||String(e),true); })
    .buatPermintaan({id:'m'+idBaru(), jenis:'ganti', no:b[2], penjual:namaToko(b[3]), nominal:b[4]});
}
function tandaiBatal(){
  var dl=S.dialog; if(!dl||dl.jalan) return;
  if(fileJalan(dl.bukti)||fileJalan(dl.buktiTf)){
    tugasBaru('tandaiBatal',{id:dl.id, orang:dl.orang, baris:dl.b[7], no:dl.b[2]},{bukti:dl.bukti,buktiTf:dl.buktiTf},'Pembatalan '+namaToko(dl.b[3]),namaToko(dl.b[3])+' ditandai dibatalkan');
    dl.b[5]='Dibatalkan'; S.dialog=null; S.aksi=null; simpanData(); toast('Ditandai dibatalkan. Bukti masih diunggah, nanti tersimpan otomatis.'); render(); return;
  }
  dl.jalan=true; dl.galat=null; render();
  srv().withSuccessHandler(function(r){
    dl.b[5]='Dibatalkan'; if(dl.bukti&&dl.bukti.hasil){ var ob=DATA.orang[dl.orang]; (ob.buktiBatal=ob.buktiBatal||{})[normNo(dl.b[2])]=[dl.bukti.hasil.mime]; } if(dl.buktiTf&&dl.buktiTf.hasil){ var ot=DATA.orang[dl.orang]; (ot.buktiTfBatal=ot.buktiTfBatal||{})[normNo(dl.b[2])]=[dl.buktiTf.hasil.mime]; } S.dialog=null; S.aksi=null; simpanData();
    toast(namaToko(dl.b[3])+' ditandai dibatalkan');
  }).withFailureHandler(function(e){
    dl.jalan=false; dl.galat=(e&&e.message)||String(e); render();
  }).tandaiBatal({id:dl.id, orang:dl.orang, baris:dl.b[7], no:dl.b[2], bukti:dl.bukti&&dl.bukti.hasil||null, buktiTf:dl.buktiTf&&dl.buktiTf.hasil||null});
}
function cairkan(){
  var dl=S.dialog; if(!dl||dl.jalan) return;
  if(fileJalan(dl.bukti)){
    tugasBaru('cairkan',{id:dl.id, orang:dl.orang, nominal:dl.nominal},{bukti:dl.bukti},'Pencairan komisi '+dl.orang,'Komisi '+dl.orang+' '+rp(dl.nominal)+' dicatat sudah cair');
    S.dialog=null; S.lembar=null; toast('Dicatat. Bukti masih diunggah, nanti tersimpan otomatis.'); render(); return;
  }
  dl.jalan=true; dl.galat=null; render();
  srv().withSuccessHandler(function(r){
    S.dialog=null; S.lembar=null;
    toast('Komisi '+r.orang+' '+rp(r.nominal)+' dicatat sudah cair');
    muat(true);
  }).withFailureHandler(function(e){
    dl.jalan=false; dl.galat=(e&&e.message)||String(e); render();
  }).cairkan({id:dl.id, orang:dl.orang, nominal:dl.nominal, bukti:dl.bukti&&dl.bukti.hasil||null});
}

/* ---------- mulai ---------- */
if('serviceWorker' in navigator && location.protocol==='https:' && location.hostname.indexOf('github.io')>=0){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
setBadge(); render();
if(KODE){ muat(!!DATA); }
ambilBagikan().then(pakaiBagikan);
setInterval(function(){ if(document.visibilityState==='visible' && KODE && DATA) muat(true); }, 5*60000);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible' && KODE && DATA){ muat(true); kirimAntre(); jalankanTugas(); } });
setInterval(function(){ if(DATA && !S.lembar && !S.dialog && document.activeElement.id!=='cari') render(); }, 60000);
</script>
